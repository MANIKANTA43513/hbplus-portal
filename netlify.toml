[build]
  command = "npx expo export --platform web --clear"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path is served by index.html so that refreshing or
# deep-linking to /dashboard loads the app, which then enforces authentication.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Report-Only: violations are logged in the browser console but nothing is blocked.
    # After checking the deployed site's console for violations, rename this header to
    # "Content-Security-Policy" to enforce it. See README section 18.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
